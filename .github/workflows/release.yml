name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      mujoco_version:
        description: MuJoCo version used for the build/test matrix
        required: true
        default: "3.11.0"

env:
  MUJOCO_VERSION: ${{ inputs.mujoco_version || '3.11.0' }}

jobs:
  # Verify that the sdist compiles and passes tests on every supported
  # platform. Nothing but the sdist is published: the native extension is
  # bound to the mujoco version present at build time, so prebuilt wheels
  # would silently pin consumers to one MuJoCo release.
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - run: uv pip install --system "mujoco==${{ env.MUJOCO_VERSION }}" pybind11 numpy pytest setuptools wheel
      - run: uv build --sdist --out-dir dist
      - name: install from the freshly built sdist
        run: uv pip install --system --no-build-isolation --no-binary mujoco-uni-runtime --no-cache --find-links dist --no-index mujoco-uni-runtime
      - run: python -m pytest tests/ -q
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        with:
          name: sdist
          path: dist/

  publish:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      id-token: write # trusted publishing (no API token stored in GitHub)
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
